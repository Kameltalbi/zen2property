# Site Nginx dédié — n'édite AUCUN autre vhost.
# Installer:
#   sudo cp deploy/nginx/zen2property.com.conf /etc/nginx/sites-available/zen2property.com
#   sudo ln -s /etc/nginx/sites-available/zen2property.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Puis Certbot:
#   sudo certbot --nginx -d zen2property.com -d www.zen2property.com

server {
    listen 80;
    listen [::]:80;
    server_name zen2property.com www.zen2property.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
