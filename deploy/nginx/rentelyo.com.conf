# Site Nginx dédié — n'édite AUCUN autre vhost.
# Domaine canonique : www.rentelyo.com
# Installer:
#   sudo cp deploy/nginx/rentelyo.com.conf /etc/nginx/sites-available/rentelyo.com
#   sudo ln -s /etc/nginx/sites-available/rentelyo.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Puis Certbot (obligatoire, sinon Chrome affiche ERR_CERT_COMMON_NAME_INVALID
# parce que le vhost SSL par défaut du VPS — ex. hydroscan.io — est présenté) :
#   sudo certbot --nginx -d www.rentelyo.com -d rentelyo.com

# Apex → www
server {
    listen 80;
    listen [::]:80;
    server_name rentelyo.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 $scheme://www.rentelyo.com$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name www.rentelyo.com;

    client_max_body_size 20m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        proxy_pass http://127.0.0.1:3120;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
