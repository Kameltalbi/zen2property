# Site Nginx dédié — n'édite AUCUN autre vhost.
# Domaine canonique : www.rentelyo.com
# Installer:
#   sudo cp deploy/nginx/rentelyo.com.conf /etc/nginx/sites-available/rentelyo.com
#   sudo ln -s /etc/nginx/sites-available/rentelyo.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Puis Certbot (obligatoire, sinon Chrome affiche ERR_CERT_COMMON_NAME_INVALID
# parce que le vhost SSL par défaut du VPS — ex. hydroscan.io — est présenté) :
#   sudo certbot --nginx -d www.rentelyo.com -d rentelyo.com

# HTTP : toujours vers HTTPS www (Certbot ajoute ensuite les blocs 443).
server {
    listen 80;
    listen [::]:80;
    server_name rentelyo.com www.rentelyo.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://www.rentelyo.com$request_uri;
    }
}
