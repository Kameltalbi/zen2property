# Site Nginx dédié — n'édite AUCUN autre vhost.
# Domaine canonique : https://rentelyo.com
# Installer:
#   sudo cp deploy/nginx/rentelyo.com.conf /etc/nginx/sites-available/rentelyo.com
#   sudo ln -sfn /etc/nginx/sites-available/rentelyo.com /etc/nginx/sites-enabled/rentelyo.com
#   sudo nginx -t && sudo systemctl reload nginx
# Puis Certbot si les certificats n'existent pas encore :
#   sudo certbot certonly --webroot -w /var/www/html -d rentelyo.com -d www.rentelyo.com
#   puis relancer deploy/deploy-vps.sh (installe le bloc SSL www → apex).

# HTTP : une seule redirection vers le domaine canonique HTTPS (pas de chaîne www).
server {
    listen 80;
    listen [::]:80;
    server_name rentelyo.com www.rentelyo.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://rentelyo.com$request_uri;
    }
}

include /etc/nginx/snippets/rentelyo-ssl.conf;
