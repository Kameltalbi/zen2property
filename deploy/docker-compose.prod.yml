# Postgres isolé pour Zen2Property uniquement.
# Projet Docker: zen2property (ne touche pas aux autres compose).
# Port hôte 55433 pour éviter 5432 / 55432 déjà utilisés.
name: zen2property

services:
  postgres:
    image: postgres:16-alpine
    container_name: zen2property-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zen2property
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong}
      POSTGRES_DB: zen2property
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - zen2property_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zen2property -d zen2property"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  zen2property_pg_data:
    name: zen2property_pg_data
