services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rentelyo
      POSTGRES_PASSWORD: rentelyo
      POSTGRES_DB: rentelyo
    ports:
      - "55432:5432"
    volumes:
      - rentelyo_pg:/var/lib/postgresql/data

volumes:
  rentelyo_pg:
